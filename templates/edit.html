{% extends 'base.html' %}{% block content %}<div class="eyebrow">Банк вопросов</div><h1>{{'Редактирование #'+q.id|string if q else 'Новый вопрос'}}</h1><div class="card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Предмет<input name="subject" value="{{q.subject if q else ''}}" required></label><label>Тип задания<select name="type">{% for t in types %}<option value="{{t}}" {% if q and q.type==t %}selected{% endif %}>{{labels[t]}}</option>{% endfor %}</select></label><label>Текст вопроса<textarea name="question" rows="7" required>{{q.question if q else ''}}</textarea></label><label>Варианты (JSON-массив, например [{"id":"А","text":"Вариант"}])<textarea name="options" rows="5">{{q.options if q else '[]'}}</textarea></label><label>Правильный ответ / эталон<textarea name="answer" rows="3">{{q.answer if q else ''}}</textarea></label><label>Иллюстрация<input type="file" name="image" accept="image/*"></label>{% if q and q.image %}<img class="question-image" src="{{url_for('upload',name=q.image)}}">{% endif %}<label class="check"><input type="checkbox" name="reviewed" {% if q and q.reviewed %}checked{% endif %}> Ключ проверен преподавателем</label><label class="check"><input type="checkbox" name="active" {% if not q or q.active %}checked{% endif %}> Включить в тесты</label><button>Сохранить</button></form></div>{% endblock %}
